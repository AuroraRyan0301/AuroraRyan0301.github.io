---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png">
    <link rel="apple-touch-icon" href="{{ base_path }}/images/apple-touch-icon-180x180.png">
    <link rel="stylesheet" href="{{ base_path }}/assets/css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  </head>

  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="topbar__brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
        <nav class="topbar__nav">
          <a href="{{ '/#about' | relative_url }}">About</a>
          <a href="{{ '/#publications' | relative_url }}">Publications</a>
        </nav>
      </div>
    </header>

    <main class="page">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}</p>
    </footer>
  </body>
</html>
