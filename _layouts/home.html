---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" type="image/png" sizes="32x32"  href="{{ base_path }}/images/favicon-32x32.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ base_path }}/images/favicon-192x192.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=2">
    <link rel="stylesheet" href="{{ base_path }}/assets/css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400;500&display=swap" rel="stylesheet">
  </head>

  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="topbar__brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
        <nav class="topbar__nav">
          <a href="{{ '/#about' | relative_url }}">About</a>
          <a href="{{ '/#publications' | relative_url }}">Publications</a>
        </nav>
      </div>
    </header>

    <main class="page">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}</p>
    </footer>

    <script>
      /* 50/50 swap of the hero portrait between the real photo and the
         anime alt on every page load (block comment so the `compress`
         layout's newline-stripping doesn't comment out the IIFE). */
      (function () {
        var img = document.querySelector('.hero__photo img');
        if (!img) return;
        var anime = '{{ "/images/profile_anime.jpg" | relative_url }}';
        if (Math.random() < 0.5) { img.src = anime; }
      })();
    </script>
    <script src="{{ base_path }}/assets/js/leaves.js" defer></script>
  </body>
</html>
